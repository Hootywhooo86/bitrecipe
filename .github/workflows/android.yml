name: Build Android APK

on:
  push:
    branches: [main, 'ccr-*']
    tags: ['v*']
    paths: ['app/**', 'native/**', 'assets/**', 'scripts/**', 'package.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Generate Android project
        run: |
          npm install --no-audit --no-fund
          bash scripts/android-setup.sh
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk bitrecipe-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bitrecipe-apk
          path: bitrecipe-debug.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: bitrecipe ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v0.1.{0}', github.run_number) }}
          make_latest: true
          files: bitrecipe-debug.apk
          body: |
            bitrecipe for Android.

            **Install:** download `bitrecipe-debug.apk` below on your phone, open it, and allow "install unknown apps" when Android asks.

            Always-newest download: https://github.com/${{ github.repository }}/releases/latest/download/bitrecipe-debug.apk

            This is a debug (test) build, not a Play Store build.
