name: Build Android APK

on:
  push:
    branches: [main, 'ccr-*']
    paths: ['app/**', 'native/**', 'assets/**', 'scripts/**', 'package.json', 'capacitor.config.json', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Generate Android project
        run: |
          npm install --no-audit --no-fund
          bash scripts/android-setup.sh
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk bitrecipe-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bitrecipe-apk
          path: bitrecipe-debug.apk
